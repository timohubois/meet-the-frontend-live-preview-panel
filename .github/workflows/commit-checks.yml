name: Commit Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: commit-checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mysqli
          tools: composer:v2
          coverage: none
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('composer.lock') }}
      - name: Check PHP
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist
          composer check-platform-reqs
          composer php:lint

  javascript:
    name: JavaScript lint, build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Lint, build and test JavaScript
        run: |
          npm ci
          npm run lint
          npm run build
          npm run test:unit
      - name: Upload built assets
        uses: actions/upload-artifact@v7
        with:
          name: built-assets
          path: build/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  browser:
    name: Chromium / WordPress ${{ matrix.wordpress }}
    needs: javascript
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', 'latest']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: build/
      - name: Download WordPress core assets
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
        run: |
          archive=latest.tar.gz
          if [[ "$WORDPRESS_VERSION" != latest ]]; then
            archive="wordpress-$WORDPRESS_VERSION.tar.gz"
          fi
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 90 \
            --output "$RUNNER_TEMP/wordpress.tar.gz" "https://wordpress.org/$archive"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" -C "$RUNNER_TEMP"
      - name: Run Chromium tests
        env:
          CHROMIUM_BIN: google-chrome
          WORDPRESS_ROOT: ${{ runner.temp }}/wordpress
        run: npm run test:browser

  integration:
    name: WordPress ${{ matrix.wordpress }} / ${{ matrix.scf && 'Secure Custom Fields' || format('Timber {0}', matrix.timber) }}
    needs: javascript
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', 'latest']
        timber: ['none', '^2.0']
        scf: [false]
        include:
          - wordpress: '6.9'
            timber: '^1.24'
            scf: false
          - wordpress: 'latest'
            timber: 'none'
            scf: true
    env:
      WORDPRESS_VERSION: ${{ matrix.wordpress }}
      TIMBER_CONSTRAINT: ${{ matrix.timber }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, mysqli
          tools: composer:v2
          coverage: none
      - name: Install WP-CLI
        run: |
          bin_dir="$RUNNER_TEMP/wp-cli"
          mkdir -p "$bin_dir"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 60 \
            --output "$bin_dir/wp" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$bin_dir/wp"
          "$bin_dir/wp" --info
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - name: Install isolated Timber dependency
        if: matrix.timber != 'none'
        run: |
          mkdir -p "$RUNNER_TEMP/timber"
          if [ "$TIMBER_CONSTRAINT" = '^1.24' ]; then
            # Legacy compatibility fixture only; no production or global Composer changes.
            composer init --working-dir="$RUNNER_TEMP/timber" --name=mtflpp/legacy-fixture --no-interaction
            composer config --working-dir="$RUNNER_TEMP/timber" allow-plugins.composer/installers false
            composer config --working-dir="$RUNNER_TEMP/timber" --json policy.advisories.ignore \
              '{"twig/twig":{"constraint":"^1.0 || ^2.0","reason":"Legacy Timber 1 compatibility fixture only; never shipped with the plugin."}}'
          fi
          composer require --working-dir="$RUNNER_TEMP/timber" "timber/timber:$TIMBER_CONSTRAINT" --no-interaction --prefer-dist
          composer show --working-dir="$RUNNER_TEMP/timber" timber/timber
      - name: Report legacy dependency advisories
        if: matrix.timber == '^1.24'
        run: |
          echo '::warning::Timber 1 requires vulnerable legacy Twig. The exception is confined to this disposable test job.'
          composer audit --working-dir="$RUNNER_TEMP/timber" --format=plain --abandoned=report
      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: build/
      - name: Install disposable WordPress
        run: |
          wp core download --path="$RUNNER_TEMP/site" --version="$WORDPRESS_VERSION"
          wp config create --path="$RUNNER_TEMP/site" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --dbprefix=mtflpp_test_
          wp core install --path="$RUNNER_TEMP/site" --url=http://mtflpp.test --title=Tests --admin_user=test --admin_password=test-only-password --admin_email=test@example.test --skip-email
          if [ "$TIMBER_CONSTRAINT" != 'none' ]; then
            mkdir -p "$RUNNER_TEMP/site/wp-content/mu-plugins"
            printf '%s\n' \
              '<?php' \
              "require \"$RUNNER_TEMP/timber/vendor/autoload.php\";" \
              'if (is_callable([\Timber\Timber::class, "init"])) {' \
              '    \Timber\Timber::init();' \
              '} else {' \
              '    new \Timber\Timber();' \
              '}' > "$RUNNER_TEMP/site/wp-content/mu-plugins/timber.php"
          fi
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/site/wp-content/plugins/meet-the-frontend-live-preview-panel"
          wp plugin activate meet-the-frontend-live-preview-panel --path="$RUNNER_TEMP/site"
      - name: Verify fixture environment
        run: |
          wp core version --path="$RUNNER_TEMP/site"
          wp --path="$RUNNER_TEMP/site" eval '
            if ((getenv("TIMBER_CONSTRAINT") !== "none") !== class_exists(\Timber\Timber::class)) {
                WP_CLI::error("Timber availability does not match the test matrix.");
            }
          '
      - name: Install and verify Secure Custom Fields
        if: matrix.scf
        run: |
          wp --path="$RUNNER_TEMP/site" plugin install secure-custom-fields --activate
          wp --path="$RUNNER_TEMP/site" plugin is-active secure-custom-fields
          wp --path="$RUNNER_TEMP/site" eval '
            if (
                !function_exists("acf_add_local_field_group") || !function_exists("acf_update_field_group")
                || !function_exists("acf_get_field_type") || !acf_get_field_type("repeater")
            ) {
                WP_CLI::error("Secure Custom Fields field APIs and Repeater must be available.");
            }
            WP_CLI::success("Secure Custom Fields " . acf_get_setting("version") . " is active.");
          '
      - name: Run Secure Custom Fields integration tests
        if: matrix.scf
        run: |
          for fixture in tests/acf.php tests/acf-choices.php tests/term-acf.php; do
            echo "::group::$fixture"
            wp --path="$RUNNER_TEMP/site" eval-file "$GITHUB_WORKSPACE/$fixture"
            echo '::endgroup::'
          done
      - name: Run WordPress integration tests
        if: ${{ !matrix.scf }}
        env:
          MTFLPP_TEST_UNINSTALL: '1'
        run: |
          echo '::notice::No custom-field plugin is installed. The custom-field fixtures skip in this job.'
          for fixture in tests/*.php; do
            echo "::group::$fixture"
            wp --path="$RUNNER_TEMP/site" eval-file "$GITHUB_WORKSPACE/$fixture"
            echo '::endgroup::'
          done
      - name: Check multisite preview isolation, migration and uninstall safety
        if: ${{ !matrix.scf }}
        env:
          MTFLPP_TEST_UNINSTALL: '1'
        run: |
          wp core multisite-convert --path="$RUNNER_TEMP/site" --base=/
          wp plugin activate meet-the-frontend-live-preview-panel --network --path="$RUNNER_TEMP/site"
          wp --path="$RUNNER_TEMP/site" eval-file "$GITHUB_WORKSPACE/tests/post-note.php"
          wp --path="$RUNNER_TEMP/site" eval-file "$GITHUB_WORKSPACE/tests/identifier-rename.php"
          wp --path="$RUNNER_TEMP/site" eval-file "$GITHUB_WORKSPACE/tests/uninstall.php"

  plugin-check:
    name: Check release package
    needs: javascript
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download built assets
        uses: actions/download-artifact@v8
        with:
          name: built-assets
          path: build/
      - name: Build release directory
        run: |
          mkdir -p "$RUNNER_TEMP/meet-the-frontend-live-preview-panel"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/meet-the-frontend-live-preview-panel/"
      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ${{ runner.temp }}/meet-the-frontend-live-preview-panel
          slug: meet-the-frontend-live-preview-panel
          strict: true
